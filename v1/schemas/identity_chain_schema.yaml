# Guardrail Identity Chain Specification
# Required for ALL Healthcare Policies
# Version 1.0 | January 2026

---
# PURPOSE
# --------
# The identity chain proves WHO did WHAT through WHICH AGENT under WHAT AUTHORITY.
# This is the foundation of audit defensibility.
#
# Without this, you can't answer:
# - "Who authorized this AI to access that patient's record?"
# - "What role justified this action?"
# - "Which system of origin did the data come from?"
#
# This specification MUST be included in every policy's enforcement section.

identity_chain:
  description: "Complete audit trail from human user through AI agent to data access or action"
  
  # Required components (policy enforcement will BLOCK if any are missing)
  required_components:
    - component: "human_user_id"
      format: "NPI | employee_id | email"
      examples:
        - "physician_npi_1234567890"
        - "emp_jane_smith_12345"
        - "nurse.practitioner@hospital.org"
      validation: "Must exist in organization's identity provider (AD, Okta)"
      
    - component: "user_role"
      format: "enumerated_role_from_rbac"
      examples:
        - "attending_physician"
        - "nurse_practitioner"
        - "prior_auth_specialist"
        - "care_coordinator"
      validation: "Must map to defined role in policy applies_to.user_roles"
      
    - component: "ai_agent_id"
      format: "unique_agent_instance_identifier"
      examples:
        - "claude-sonnet-4-healthcare-instance-42"
        - "chatgpt-health-prod-agent-007"
        - "custom-prior-auth-bot-v2.3"
      validation: "Must be registered in Guardrail's agent registry"
      
    - component: "ai_agent_version"
      format: "model_version_string"
      examples:
        - "claude-sonnet-4-20250514"
        - "gpt-4-1106-preview"
        - "custom-model-v2.3.1"
      purpose: "Reproducibility and rollback capability"
      
    - component: "system_of_origin"
      format: "source_system_identifier"
      examples:
        - "epic_ehr_prod"
        - "cerner_patient_portal"
        - "claims_database_oracle"
        - "cms_coverage_api"
      validation: "Must be registered data source"
      notes: "This is where the PHI/action request originated from"
  
  # Optional but recommended components
  optional_components:
    - component: "session_id"
      format: "unique_session_token"
      purpose: "Track related requests in same user session"
      
    - component: "department"
      format: "clinical_department_or_service_line"
      examples: ["cardiology", "emergency_medicine", "primary_care"]
      purpose: "Additional context for audit analysis"
      
    - component: "location"
      format: "physical_or_virtual_location"
      examples: ["hospital_main_campus", "clinic_site_5", "remote_telehealth"]
      purpose: "Geolocation compliance (data residency)"
      
    - component: "on_behalf_of"
      format: "patient_mrn | other_user_id"
      purpose: "If agent acting on behalf of patient or another user"
      examples: ["patient_mrn_987654", "proxy_family_member_id"]
  
  # Enforcement rules
  enforcement:
    block_if_missing: true
    block_message: |
      "Identity chain incomplete. Guardrail requires complete audit trail:
      - Human user ID
      - User role
      - AI agent ID
      - System of origin
      
      This request cannot proceed without full identity context."
    
    validation_sequence:
      1: "Verify human_user_id exists in identity provider"
      2: "Verify user_role matches approved roles for this workflow"
      3: "Verify ai_agent_id is registered and active"
      4: "Verify system_of_origin is authorized data source"
      5: "If all pass → proceed to policy evaluation"
      6: "If any fail → BLOCK with specific error message"
  
  # Audit trail format
  audit_mapping:
    format: "USER:{human_user_id} → ROLE:{user_role} → AGENT:{ai_agent_id} → POLICY:{policy_id} → SOURCE:{system_of_origin} → ACTION:{action_taken}"
    
    example: "USER:physician_npi_1234567890 → ROLE:attending_physician → AGENT:claude-healthcare-42 → POLICY:HIPAA_PRIOR_AUTH_001 → SOURCE:epic_ehr_prod → ACTION:access_patient_diagnosis"
    
    log_level: "always"  # Every request logs identity chain
    retention: "6_years"  # HIPAA requirement
    
    export_formats:
      - "json"  # Machine-readable for SIEM integration
      - "csv"   # Human-readable for compliance review
      - "human_readable_sentence"  # Natural language for auditors

# INTEGRATION WITH DECISION OBJECT
# ---------------------------------
# The identity_chain becomes part of the canonical Decision Object.
# See: /schemas/decision.schema.json
#
# Every decision MUST include the complete identity_chain in the output.

decision_object_mapping:
  field: "identity_chain"
  required: true
  structure:
    user_id: "from identity_chain.human_user_id"
    user_role: "from identity_chain.user_role"
    user_department: "from identity_chain.department (if available)"
    agent_id: "from identity_chain.ai_agent_id"
    agent_version: "from identity_chain.ai_agent_version"
    session_id: "from identity_chain.session_id (if available)"
    on_behalf_of: "from identity_chain.on_behalf_of (if applicable)"

# EXAMPLES
# --------

example_valid_identity_chain:
  human_user_id: "physician_npi_1234567890"
  user_role: "attending_physician"
  user_department: "cardiology"
  ai_agent_id: "claude-healthcare-instance-42"
  ai_agent_version: "claude-sonnet-4-20250514"
  session_id: "sess_abc123def456"
  system_of_origin: "epic_ehr_prod"
  on_behalf_of: null  # Physician acting directly, not on behalf of patient
  
  audit_string: "USER:physician_npi_1234567890 → ROLE:attending_physician → AGENT:claude-healthcare-instance-42 → POLICY:HIPAA_PRIOR_AUTH_001 → SOURCE:epic_ehr_prod → ACTION:access_diagnosis_codes"

example_patient_portal_chain:
  human_user_id: "patient_portal_user_jane_doe_987654"
  user_role: "patient_self_service"
  ai_agent_id: "chatgpt-health-patient-portal-3"
  ai_agent_version: "gpt-4-1106-preview"
  session_id: "sess_patient_xyz789"
  system_of_origin: "patient_portal_mychart"
  on_behalf_of: "patient_mrn_987654"  # Patient accessing their own records
  
  audit_string: "USER:patient_jane_doe_987654 → ROLE:patient_self_service → AGENT:chatgpt-patient-portal-3 → POLICY:CONSUMER_HEALTH_004 → SOURCE:patient_portal → ACTION:view_own_lab_results"

example_missing_component_block:
  provided:
    ai_agent_id: "claude-healthcare-42"
    system_of_origin: "epic_ehr_prod"
  
  missing:
    - "human_user_id"
    - "user_role"
  
  result: "BLOCKED"
  error_message: |
    "Identity chain incomplete. Missing required components:
    - human_user_id
    - user_role
    
    Cannot proceed without complete audit trail."
  
  logged_as: "identity_chain_failure"

# COMPLIANCE BENEFITS
# -------------------
#
# With complete identity chain, organizations can answer:
#
# OCR Question: "Who accessed this patient's HIV status?"
# Answer: "USER:physician_npi_X → ROLE:infectious_disease_specialist → AGENT:claude-Y → approved by privacy officer at [timestamp]"
#
# OCR Question: "What authority did this AI agent have?"
# Answer: "Agent acted under ROLE:attending_physician with POLICY:HIPAA_PRIOR_AUTH_001 which permits diagnosis access for coverage determination"
#
# OCR Question: "Can you prove a human was responsible?"
# Answer: "Yes. USER:physician_npi_X initiated request, AGENT:claude-Y executed, physician reviewed and approved at [timestamp]"

# NOTES FOR IMPLEMENTATION
# -------------------------
#
# 1. Identity providers: Integrate with AD, Okta, or hospital IAM
# 2. Agent registry: Maintain list of approved AI agents with versions
# 3. Data source registry: Maintain list of authorized PHI sources
# 4. Validation happens BEFORE policy evaluation
# 5. Incomplete identity chain = automatic BLOCK
#
# This is non-negotiable. Without identity chain, you have no audit trail.
